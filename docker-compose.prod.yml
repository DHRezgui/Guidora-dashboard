services:
  web:
    build:
      context: .
      dockerfile: .docker/prod/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.example.com/api/v1}
    env_file: .docker/prod/.env
    ports:
      - '3003:3000'
    networks:
      - onboarding-dashboard-prod
    restart: always
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  onboarding-dashboard-prod:
    driver: bridge
